# Coverage gate for coverage.mintplayer.com.
#
# Read from the BASE ref, so this file does not affect the pull request that introduces it
# - it takes effect on the next one. Expecting to see it work immediately looks like a bug
# and is not one.
#
# Non-blocking to start with: this repository went from zero executed assertions to a real
# suite in one change, so there is no history to set a meaningful threshold against yet.
# The check runs still appear on every pull request; they just conclude neutrally.
gate:
  projectMode: auto
  # scoped, not projection. Assemblies enter the report as tests are written for them, and
  # a projection basis reads every newly-measured assembly arriving at 30% as a "drop".
  projectBasis: scoped
  projectThreshold: 1
  # Patch coverage is the number worth watching here. The project total is dragged down
  # permanently by surfaces that cannot be exercised in CI - P/Invoke into Win32 icon APIs,
  # registry reads, GDI+ painting - whereas new code has no such excuse.
  patchTarget: 80
  patchThreshold: 5
  blocking: false

# MintPlayer package versioning (added by the onboarding pull request). The publish workflow tags every release
# `<package id>/v<version>`; the commented lines are the defaults.
versioning:
  mode: server                       # server | local: local runs the engine on the runner, without the app
#   releaseBranches: ["release/*.x"]
#   ignore: ["**/*.md"]              # changed files that never release a package
#   prerelease: upstream             # alpha | beta | next | preview | rc pins the label; upstream mirrors dependencies and the SDK
#   groups:                         # packages that always share one version
#     - name: core
#       packages: [Acme.Core, Acme.Core.*]
#   packages:
#     Acme.Generators: { anchor: free }   # free, or the framework package whose major it follows

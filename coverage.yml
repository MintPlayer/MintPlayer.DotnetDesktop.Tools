# MintPlayer dependency updates (added by the onboarding pull request). Every line is a default: uncomment to change it.
# dependencies:
#   enabled: true
#   schedule: { frequency: weekly, weekday: monday, hour: 6 }   # in the account's time zone
#   cooldown: 3d                     # third-party releases wait this long; may only lengthen the account's
#   autoMerge:                       # the largest update merged through the merge queue without an approval
#     default: minor
#     "@angular/*": never            # never: every update waits for `approve <group>`
#     maxCoverageDrop: 0.5           # percentage points
#   rules:
#     - match: ["some-package"]
#       ignore: true
#   migrate:                         # approved majors run a migration workflow after the apply
#     - match: "@angular/core"
#       onMajor: angular-migrate.yml
#     - match: "nx"
#       onMajor: nx-migrate.yml

# Coverage gate for coverage.mintplayer.com.
#
# Read from the BASE ref, so this file does not affect the pull request that introduces it
# - it takes effect on the next one. Expecting to see it work immediately looks like a bug
# and is not one.
#
# Non-blocking to start with: this repository went from zero executed assertions to a real
# suite in one change, so there is no history to set a meaningful threshold against yet.
# The check runs still appear on every pull request; they just conclude neutrally.
gate:
  projectMode: auto
  # scoped, not projection. Assemblies enter the report as tests are written for them, and
  # a projection basis reads every newly-measured assembly arriving at 30% as a "drop".
  projectBasis: scoped
  projectThreshold: 1
  # Patch coverage is the number worth watching here. The project total is dragged down
  # permanently by surfaces that cannot be exercised in CI - P/Invoke into Win32 icon APIs,
  # registry reads, GDI+ painting - whereas new code has no such excuse.
  patchTarget: 80
  patchThreshold: 5
  blocking: false

# The merge queue (added by the onboarding pull request): dependency pull requests within your thresholds merge through
# it, and your own pull requests can use it too (label `merge-queue`, or comment `/queue`).
mergeQueue:
  enabled: true

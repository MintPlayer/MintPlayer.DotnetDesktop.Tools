name: pull-request

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pull-request
    uses: ./.github/workflows/_build.yml
    with:
      upload-coverage: true
      # Lets the service compute the patch coverage rate - how much of what THIS pull
      # request changed is covered, as opposed to the project total.
      coverage-base-sha: ${{ github.event.pull_request.base.sha }}
      # Fork pull requests get no secrets, so the upload cannot work there. Skipping is
      # right; a contributor's pull request must not go red over a missing token.
      is-fork-pr: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    secrets: inherit

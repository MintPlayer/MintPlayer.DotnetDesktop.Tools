name: build-master

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-master
    uses: ./.github/workflows/_build.yml
    with:
      # master is the baseline every pull request's project coverage is measured against.
      upload-coverage: true
    secrets: inherit

# Shared build/test/coverage pipeline. The four entry workflows differ only in their
# triggers and in whether they upload coverage or publish packages, so the pipeline itself
# lives here once. Editing it in four copies is how the org's workflows drifted: one repo
# installs only the .NET 11 SDK while another correctly installs .NET 10 alongside it.

name: build

on:
  workflow_call:
    inputs:
      upload-coverage:
        description: Upload the coverage report to coverage.mintplayer.com.
        type: boolean
        default: false
      coverage-base-sha:
        description: Base commit of the pull request, used for the patch coverage rate.
        type: string
        default: ''
      is-fork-pr:
        description: Whether this run is a pull request from a fork, which gets no secrets.
        type: boolean
        default: false
      publish:
        description: Push the packed NuGet packages.
        type: boolean
        default: false
    secrets:
      COVERAGE_TOKEN:
        required: false
      PUBLISH_TO_NUGET_ORG:
        required: false

jobs:
  build:
    name: build
    # Windows, not ubuntu-latest. Every library here targets net*-windows, and while
    # EnableWindowsTargeting lets those COMPILE on Linux, it does not provide the Windows
    # Desktop runtime the tests need in order to run.
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The .NET 11 SDK builds everything (global.json pins the exact RC). The .NET 10
          # SDK is installed for its runtime, which is what actually executes the net10.0
          # half of the multi-targeted libraries.
          # Pinned exactly rather than 11.0.x: while .NET 11 is a release candidate, a
          # floating version would let an RC2 change CI behaviour without a commit.
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

      - name: Restore
        run: dotnet restore
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        # --no-restore does NOT imply --no-build. Without --no-build the solution is built
        # a second time and coverage is measured against a build nothing else uses.
        #
        # Coverage comes from Microsoft.Testing.Extensions.CodeCoverage via Microsoft.Testing
        # .Platform, NOT from coverlet's "XPlat Code Coverage" data collector: xUnit v3 runs
        # on MTP, and MTP dropped its VSTest bridge on the .NET 10 SDK and later. The runner
        # is selected in global.json.
        run: >
          dotnet test --no-restore --no-build --configuration Release
          --
          --coverage --coverage-output-format cobertura --results-directory coverage

      - name: Upload coverage
        id: coverage
        # hashFiles guard: a run that produced no report is a no-op rather than an upload of
        # nothing. That matters more here than usual, because a test host that rejects an
        # option reports "Zero tests ran" rather than failing loudly.
        if: >
          inputs.upload-coverage
          && !inputs.is-fork-pr
          && hashFiles('coverage/*.cobertura.xml') != ''
        continue-on-error: true
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
        with:
          url: https://coverage.mintplayer.com
          token: ${{ secrets.COVERAGE_TOKEN }}
          # One file per test project, at the TOP LEVEL only - deliberately not `**`.
          # Microsoft.Testing.Platform also writes coverage/merged/merged-*.cobertura.xml,
          # which is the union of these six; a `**` glob uploads both and the server counts
          # every line twice.
          files: |
            coverage/*.cobertura.xml
          # With search on, a glob matching nothing silently falls back to auto-detection
          # and would upload stray unparsable reports.
          disable-search: true
          base-sha: ${{ inputs.coverage-base-sha }}
          # Ask the server what it actually made of the upload. Without this the action
          # learns nothing beyond "accepted", which is how a build that measured ZERO files
          # still passed: the action's own fail-on-zero guard counts paths IT rebased, not
          # files the SERVER resolved, and those are different numbers.
          wait-for-finalize: true
          # Well under the server's 30-minute ceiling: this is a diagnostic, and it must not
          # hold a Windows runner hostage if the server never finalizes.
          wait-timeout: 600
          # Closes the build now instead of waiting out the debounce, so the check runs
          # appear while the pull request is still being looked at.
          finish: true
          # A coverage-service outage must never be the reason a build fails or a release
          # is blocked.
          fail-ci-if-error: false

      - name: Report what the coverage server made of the upload
        # "Upload accepted" only means the bytes arrived. A build can be accepted, finalized
        # and still have measured NOTHING, which is exactly what happened on a0525c4: the
        # commit page read "0 file(s) measured on this commit" while this job was green.
        #
        # This step puts the server's own verdict in the log and fails when it measured no
        # files, so that state can never again pass as a successful build.
        if: always() && steps.coverage.outcome == 'success'
        shell: bash
        run: |
          echo "state:            ${{ steps.coverage.outputs.state }}"
          echo "files-count:      ${{ steps.coverage.outputs.files-count }}"
          echo "line-rate:        ${{ steps.coverage.outputs.line-rate }}"
          echo "lines-covered:    ${{ steps.coverage.outputs.lines-covered }}"
          echo "lines-coverable:  ${{ steps.coverage.outputs.lines-coverable }}"
          echo "commit-url:       ${{ steps.coverage.outputs.commit-url }}"
          echo "assembly-completeness:      ${{ steps.coverage.outputs.assembly-completeness }}"
          echo "assembly-incomplete-reasons: ${{ steps.coverage.outputs.assembly-incomplete-reasons }}"
          echo "projection-incomplete-reasons: ${{ steps.coverage.outputs.projection-incomplete-reasons }}"

          {
            echo "### Coverage"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| state | ${{ steps.coverage.outputs.state }} |"
            echo "| files measured | ${{ steps.coverage.outputs.files-count }} |"
            echo "| line rate | ${{ steps.coverage.outputs.line-rate }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Treat EMPTY as failure too, not just "0". On the run that exposed the BOM the
          # server returned CompleteWithErrors with files-count unset, so a `= "0"` test
          # did not fire and the build stayed green on an empty report - the very thing
          # this guard exists to prevent.
          files='${{ steps.coverage.outputs.files-count }}'
          state='${{ steps.coverage.outputs.state }}'

          if [ "$state" != "Complete" ]; then
            echo "::error::The coverage build finalized as '$state' rather than 'Complete'. The report is incomplete or empty; see the reasons logged above."
            exit 1
          fi

          if [ -z "$files" ] || [ "$files" = "0" ]; then
            echo "::error::The coverage server measured ${files:-no} files. The upload was accepted but nothing resolved, so the report is empty."
            exit 1
          fi

      - name: Pack
        run: dotnet pack --no-build --configuration Release /p:ContinuousIntegrationBuild=true

      - name: Push to NuGet
        if: inputs.publish
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PUBLISH_TO_NUGET_ORG }} --skip-duplicate

      - name: Push to GitHub Packages
        if: inputs.publish
        # --no-symbols because GitHub Packages rejects symbol packages. nuget.org gets the
        # matching .snupkg automatically alongside each .nupkg, which is why only this push
        # needs the flag.
        run: dotnet nuget push "**/*.nupkg" --no-symbols --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

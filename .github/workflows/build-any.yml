name: build-any

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch that already has an open pull request triggers BOTH this workflow
  # and pull-request.yml, running the whole pipeline twice for the same commit. That costs
  # double on a Windows runner, so this job asks whether pull-request.yml is already
  # covering the push and skips the build when it is.
  #
  # Same approach as MintPlayer/mintplayer-ng-seo#24.
  check-open-pr:
    name: check for an open pull request
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      count: ${{ steps.openpr.outputs.count }}

    steps:
      - name: Is there an open PR for this branch?
        id: openpr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "Open pull request found for ${{ github.ref_name }}; pull-request.yml covers this push." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build-any
    needs: check-open-pr
    if: needs.check-open-pr.outputs.count == '0'
    uses: ./.github/workflows/_build.yml
    # No coverage upload from feature branches: the service keys builds on the commit, and
    # a branch that is neither master nor a pull request has nothing to compare against.
    secrets: inherit

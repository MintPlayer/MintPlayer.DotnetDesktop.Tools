name: build-any

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-any
    uses: ./.github/workflows/_build.yml
    # No coverage upload from feature branches: the service keys builds on the commit, and
    # a branch that is not master and not a pull request has nothing to compare against.
    secrets: inherit

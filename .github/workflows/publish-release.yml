name: publish-release

on:
  push:
    branches:
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: publish-release
    uses: ./.github/workflows/_build.yml
    with:
      upload-coverage: true
      publish: true
    secrets: inherit
